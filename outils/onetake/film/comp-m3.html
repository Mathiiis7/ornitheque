<!doctype html>
<meta charset="utf-8">
<title>L'Ornitheque - moment 3, essais</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  canvas{display:block;width:1920px;height:1080px}
</style>
<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<script src="motion.js"></script>
<script src="donnees-m3.js"></script>
<script src="police-v2.js"></script>
<script src="look.js"></script>
<script>
// =============================================================================
// L'Ornitheque - moment 3 « Mesure-toi a tes amis. », quatre essais a comparer (2026-10-31).
//   a : le 212 du moment 2 vole dans la ligne d'Alex, qui double Lina ; un trophee s'allume.
//   b : la course : les cinq nombres et leurs barres montent, les lignes se doublent.
//   c : le trophee : le classement passe, la camera plonge dans la page Trophees.
//   d : Qui a vu quoi : la grille se remplit case par case, la colonne d'Alex ressort.
//   e : le montage retenu : part de la fenetre du trophee, le 200 fait passer Alex premier, puis la grille.
//   f : suit e : le clic sur une espece que les amis ont vue, sa fiche, les mois, le chant.
//   m : suit f : le selecteur de pays, continent par continent, et le mur de l'Australie.
//   g : suit m : les observations recentes de la Bretagne, puis une manche du quiz.
// Chacun part de la derniere image du moment 2 : le logo et le nom restent, le 212 survit.
// Tout vient du site (v2-m3.py). Tout est une fonction PURE du temps.
// =============================================================================
const V = '__VARIANTE__';
const DUR = { a: 7.8, b: 8.2, c: 8.2, d: 8.2, e: 9.9, f: 11.77, g: 11.96, m: 6.0 }[V];
window.__meta = { dur: DUR, fps: 30, w: 1920, h: 1080 };
const W = 1920, H = 1080;
const { clamp, lerp, spring } = OM;
const E = OM.ease;
const seg = (a, b, t) => clamp((t - a) / (b - a), 0, 1);
// Le rythme : Mathis trouvait que ca allait vite par moments (2026-11-01). Chaque rangee dit quel instant de la
// composition montrer a quel instant du film : deux instants egaux font un arret, un ecart plus grand ralentit.
const TEMPS = {
  m: [[0, 0], [6, 6]],
  a: [[0, 0], [7.8, 7.8]], b: [[0, 0], [8.2, 8.2]], c: [[0, 0], [8.2, 8.2]], d: [[0, 0], [8.2, 8.2]],
  e: [[0, 0], [0.95, 0.95], [1.73, 1.6], [2.43, 2.3], [2.73, 2.3], [2.88, 2.45], [4.155, 3.3], [4.455, 3.6], [4.955, 3.6], [5.055, 3.7], [6.105, 4.75], [8.745, 6.95], [9.9, 8.1]],
  f: [[0, 0], [0.1, 0.1], [1.18, 1.0], [2.18, 2.0], [3.08, 2.0], [3.23, 2.15], [3.95, 2.75], [4.15, 2.95], [7.5, 5.53], [7.72, 5.75], [9.02, 6.75], [11.77, 9.5]],
  g: [[0, 0], [1.05, 1.05], [2.94, 2.4], [3.54, 3.0], [5.94, 3.0], [6.79, 3.85], [7.29, 3.85], [8.04, 4.6], [9.96, 6.2], [10.86, 7.1], [11.26, 7.1], [11.96, 7.8]],
}[V];
let TF = 0;   // l'instant du film : le clic sur un point se joue pendant un arret de la composition
function tempsComp(t) {
  TF = t;
  for (let i = 1; i < TEMPS.length; i++) {
    const a = TEMPS[i - 1], b = TEMPS[i];
    if (t <= b[0]) return lerp(a[1], b[1], seg(a[0], b[0], t));
  }
  return TEMPS[TEMPS.length - 1][1];
}
const L = window.LOOK.color;
const titre = px => '700 ' + px + 'px "Source Serif Film"';
const texte = (poids, px) => poids + ' ' + px + 'px "Segoe UI", sans-serif';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const IM = {};
const TB = window.M3.table, GR = window.M3.grille, TA = window.M3.tropheeAvant;
const ALEX = TB.lignes.findIndex(l => l.moi), LINA = TB.lignes.findIndex(l => l.nom === 'Lina');
const MAX = TB.lignes[0].n, N_ALEX = TB.lignes[ALEX].n;   // 200, lu sur le site : le Martin-pecheur vient d'entrer

// --- Le raccord avec le moment 2 ------------------------------------------------------------
const SORTIE = 0.5, SORTIE_FIN = 1.15;         // la carte s'efface vers le fond
function dessineCarte(t) {
  const k = E.expoInOut(seg(SORTIE, SORTIE_FIN, t));
  if (k >= 1) return;
  ctx.save();
  ctx.globalAlpha = 1 - k;
  const z = 1 + 0.1 * k;
  ctx.translate(1180, 540); ctx.scale(z, z); ctx.translate(-1180, -540);
  ctx.drawImage(IM.carte, 0, 0, W, H);
  ctx.restore();
  const v = ctx.createLinearGradient(0, 0, 900, 0);
  v.addColorStop(0, 'rgba(238,242,241,0.72)'); v.addColorStop(0.6, 'rgba(238,242,241,0.45)'); v.addColorStop(1, 'rgba(238,242,241,0)');
  ctx.save(); ctx.globalAlpha = 1 - k; ctx.fillStyle = v; ctx.fillRect(0, 0, 900, H); ctx.restore();
}
function anciennePhrase(t) {
  const k = E.expoIn(seg(SORTIE, SORTIE + 0.4, t));
  if (k >= 1) return;
  ctx.save();
  ctx.globalAlpha = 1 - k;
  ctx.font = titre(104);
  ['Note chaque', 'oiseau que', 'tu vois.'].forEach((s, i) => {
    ctx.fillStyle = i === 2 ? L.accent : L.ink;
    ctx.fillText(s, 74, 310 + i * 120 - 90 * k);
  });
  ctx.restore();
}
const PHRASE = 'Mesure-toi à tes amis.';
function phrase(t, t0, fin) {
  if (t < t0) return;
  const sort = fin ? E.expoIn(seg(fin, fin + 0.35, t)) : 0;
  if (sort >= 1) return;
  ctx.save();
  ctx.font = titre(84); ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < PHRASE.length; i++) {
    const g = OM.letterDrop(t, t0, i, { stagger: 0.02, dist: 50, squash: 0.0075 });
    if (g.op <= 0.01) continue;
    ctx.save();
    ctx.globalAlpha = g.op * (1 - sort);
    ctx.translate(74 + ctx.measureText(PHRASE.slice(0, i)).width, 208 + g.y - 60 * sort);
    ctx.scale(g.sx, g.sy);
    ctx.fillStyle = i >= 13 ? L.accent : L.ink;   // « tes amis. »
    ctx.fillText(PHRASE[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}
function logo(t, op = 1) {
  if (op <= 0) return;
  ctx.save(); ctx.globalAlpha = op; ctx.drawImage(IM.logo, 0, 0, W, H); ctx.restore();
}

// --- Le tableau, en coordonnees de la page ; cam = { s, x, y } ---------------------------------
function camera(cles, t) {
  let c = cles[0];
  for (let i = 1; i < cles.length; i++) {
    const a = cles[i - 1], b = cles[i];
    if (t <= b.t0) break;
    const k = E.expoInOut(seg(b.t0, b.t1, t));
    c = { s: lerp(a.s, b.s, k), x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) };
  }
  return c;
}
const versEcran = (cam, x, y) => [cam.x + x * cam.s, cam.y + y * cam.s];
function metCam(cam) { ctx.translate(cam.x, cam.y); ctx.scale(cam.s, cam.s); }
const slotY = TB.lignes.map(l => l.y);
const ZOOM = 0.85;
function ligne(i, y, valeur, op = 1) {
  const l = TB.lignes[i];
  ctx.save();
  ctx.globalAlpha = op;
  ctx.translate(0, y);
  ctx.drawImage(IM['l' + i], 0, 0, l.w, l.h);
  // le nombre et sa jauge, comme sur le site
  const sc = l.score, ec = l.ecart;
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.font = texte(700, 14 * ZOOM);
  ctx.fillStyle = TB.styleNb[2];
  ctx.fillText(String(Math.round(valeur)), sc.x + sc.w, sc.y - l.y + 11.4);
  const ey = ec.y - l.y, ex = ec.x;
  const fond = new Path2D(); fond.roundRect(ex, ey, ec.w, ec.h, ec.h / 2);
  ctx.fillStyle = l.fondEcart; ctx.fill(fond);
  const g = new Path2D(); g.roundRect(ex, ey, ec.w * clamp(valeur / MAX, 0, 1), ec.h, ec.h / 2);
  ctx.fillStyle = l.jaugeCoul; ctx.fill(g);
  ctx.restore();
}
function rangs(slots) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  TB.lignes.forEach((l, j) => {
    if (slots && !slots.includes(j)) return;
    ctx.font = texte(700, 13 * ZOOM);
    ctx.fillStyle = TB.styleRang[2];
    ctx.fillText(l.rangTxt, l.rang.x + l.rang.w / 2, slotY[j] + l.rang.h / 2 + 0.5);
  });
  ctx.restore();
}
function entete(op = 1) {
  ctx.save(); ctx.globalAlpha = op;
  ctx.drawImage(IM.entete, 0, 0, TB.entete.w, TB.entete.h);
  ctx.restore();
}
// Le tableau arrive : chaque rangee monte en ressort depuis le bas, l'une apres l'autre.
const arrivee = (t, t0, i) => {
  const k = spring(t - t0 - i * 0.05, 0.6, 22);
  return { dy: (1 - k) * 70, op: clamp((t - t0 - i * 0.05) / 0.12, 0, 1) };
};

// --- Le compteur du moment 2 --------------------------------------------------------------
function compteur(t, vol) {
  const fin = vol.t1;
  const entree = vol.entree === undefined ? 1 : seg(vol.entree, vol.entree + 0.25, t);
  if (entree <= 0) return;
  if (t > fin + 0.02) return;
  const k = E.expoInOut(seg(vol.t0, fin, t));
  const [cx, cy] = vol.cible(t);
  const px = lerp(150, vol.px, k);
  const dx = lerp(80 + 240, cx, k), dy = lerp(985, cy, k);
  ctx.save();
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'right';
  ctx.font = titre(px);
  ctx.fillStyle = L.accent;
  ctx.globalAlpha = entree * (vol.fondu ? 1 - seg(fin - 0.25, fin, t) : 1);
  ctx.fillText(String(N_ALEX), dx, dy);
  const rest = 1 - seg(vol.t0, vol.t0 + 0.2, t);
  if (rest > 0) {
    ctx.globalAlpha = rest * entree;
    ctx.textAlign = 'left';
    ctx.font = titre(60); ctx.fillStyle = L.mute;
    ctx.fillText('/ 467', 80 + 264, 985);
    ctx.font = window.LOOK.font('text', 28);
    ctx.fillText('espèces vues', 88, 1037);
  }
  ctx.restore();
}

// --- Le trophee -----------------------------------------------------------------------------
const BARRE = TA.bars.find(b => /outer/.test(b.c));
const COUL_T = 'rgb(209, 136, 85)';
// La carte Marco Polo : verrouillee, sa barre se remplit, puis la carte gagnee du site prend sa place.
function carteTrophee(t, cx, cy, s, tRemp, tRemp1, tGagne) {
  const w = TA.w + 4, h = TA.h + 4;
  const gagne = E.quartOut(seg(tGagne, tGagne + 0.25, t));
  const pouls = t > tGagne ? 0.1 * Math.exp(-(t - tGagne) * 7) * Math.cos((t - tGagne) * 22) : 0;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s * (1 + pouls), s * (1 + pouls));
  ctx.translate(-w / 2, -h / 2);
  // une carte verrouillee n'a pas de fond sur le site (la page est blanche) : ici elle passe sur le tableau
  const socle = new Path2D(); socle.roundRect(2.5, 2.5, w - 5, h - 5, 11);
  ctx.save();
  ctx.shadowColor = 'rgba(21,32,30,0.30)'; ctx.shadowBlur = 40 * s; ctx.shadowOffsetY = 14 * s;
  ctx.fillStyle = '#fff'; ctx.fill(socle);
  ctx.restore();
  ctx.drawImage(IM.mpAvant, 0, 0, w, h);
  if (t < tGagne + 0.3) {
    const k = lerp(0.5, 1, E.cubicInOut(seg(tRemp, tRemp1, t)));
    const b = new Path2D(); b.roundRect(BARRE.x + 2, BARRE.y + 2, BARRE.w * k, BARRE.h, BARRE.h / 2);
    ctx.fillStyle = COUL_T; ctx.fill(b);
  }
  if (gagne > 0) { ctx.globalAlpha = gagne; ctx.drawImage(IM.mpApres, 0, 0, w, h); }
  ctx.restore();
}

// --- a : le 212 double Lina ------------------------------------------------------------------
const CAM_A = [{ t0: 0, t1: 0, s: 1.4, x: 87, y: 262 }, { t0: 2.2, t1: 2.75, s: 2.05, x: 60, y: 245 }];
function varA(t) {
  const VOL = 1.35, POSE = 2.0, DOUBLE = 2.95;
  const kD = spring(t - DOUBLE, 0.62, 14);
  const cam = camera(CAM_A, t);
  dessineCarte(t); anciennePhrase(t); logo(t); phrase(t, 0.95);
  if (t > SORTIE + 0.2) {
    ctx.save(); metCam(cam);
    const a0 = arrivee(t, 0.75, 0);
    ctx.save(); ctx.translate(0, a0.dy); entete(a0.op); ctx.restore();
    [0, 1, 2].forEach(i => { const a = arrivee(t, 0.75, i + 1); ligne(i, slotY[i] + a.dy, TB.lignes[i].n, a.op); });
    const a = arrivee(t, 0.75, 4);
    ligne(LINA, lerp(slotY[3], slotY[4], kD) + a.dy, TB.lignes[LINA].n, a.op);
    if (t >= POSE) {
      const p = spring(t - POSE, 0.5, 26);
      ctx.save();
      ctx.shadowColor = t > DOUBLE && t < DOUBLE + 0.5 ? 'rgba(21,32,30,0.25)' : 'transparent';
      ctx.shadowBlur = 16;
      ctx.translate(0, (1 - p) * 8);
      ligne(ALEX, lerp(slotY[4], slotY[3], kD), N_ALEX, clamp((t - POSE) / 0.08, 0, 1));
      ctx.restore();
    }
    if (a.op > 0) rangs(t >= POSE ? null : [0, 1, 2, 3]);
    ctx.restore();
  }
  compteur(t, { t0: VOL, t1: POSE, px: 14 * ZOOM * cam.s, cible: tt => {
    const c = camera(CAM_A, tt), l = TB.lignes[ALEX];
    return versEcran(c, l.score.x + l.score.w, slotY[4] + (l.score.y - l.y) + 11.4);
  } });
  // le trophee tombe a droite, puis se gagne
  const TT = 3.95;
  if (t > TT) {
    const k = spring(t - TT, 0.55, 18);
    carteTrophee(t, 1560, lerp(-300, 610, k), 1.5, TT + 0.55, TT + 1.25, TT + 1.3);
  }
}

// --- b : la course ---------------------------------------------------------------------------
const RACE0 = 1.5, RACE1 = 5.0;
const PUISS = [0.72, 0.8, 0.86, 1.25, 0.5];        // Alex part lentement, Lina vite : il la double en route
const valeur = (i, t) => TB.lignes[i].n * Math.pow(E.sineInOut(seg(RACE0, RACE1, t)), PUISS[i]);
function rangEntier(i, t) {
  // avant le depart, tous a zero : l'ordre est celui des tout premiers instants de la course
  const tt = Math.max(t, RACE0 + 0.12);
  let p = 0;
  for (let j = 0; j < 5; j++) {
    if (j === i) continue;
    const d = valeur(j, tt) - valeur(i, tt);
    if (d > 0 || (d === 0 && j < i)) p++;
  }
  return p;
}
function placeCourse(i, t) {
  // la moyenne du rang sur un court instant : une ligne glisse vers sa nouvelle place en 0,25 s
  // au lieu de sauter. Une place continue calculee sur les ecarts superposait les lignes a egalite.
  const N = 8;
  let p = 0;
  for (let k = 0; k < N; k++) p += rangEntier(i, t - k * 0.25 / N);
  return p / N;
}
const CAM_B = [{ t0: 0, t1: 0, s: 2.05, x: 60, y: 262 }, { t0: 5.4, t1: 6.1, s: 1.4, x: 87, y: 262 }];
function varB(t) {
  const cam = camera(CAM_B, t);
  dessineCarte(t); anciennePhrase(t); logo(t); phrase(t, 0.95);
  if (t > SORTIE + 0.2) {
    ctx.save(); metCam(cam);
    const a0 = arrivee(t, 0.75, 0);
    ctx.save(); ctx.translate(0, a0.dy); entete(a0.op); ctx.restore();
    const ord = [0, 1, 2, 4, 3];
    ord.forEach(i => {
      const a = arrivee(t, 0.75, i + 1);
      const place = placeCourse(i, t);
      const y = lerp(slotY[0], slotY[4], place / 4);
      ligne(i, y + a.dy, valeur(i, t), a.op);
    });
    if (t > 0.9) rangs(null);
    ctx.restore();
  }
  compteur(t, { t0: SORTIE, t1: 1.3, px: 60, fondu: true, cible: () => [400, 800] });
}

// --- c : le trophee en vedette ---------------------------------------------------------------
const CAM_C = [{ t0: 0, t1: 0, s: 1.4, x: 87, y: 262 }, { t0: 2.5, t1: 3.15, s: 9, x: -700, y: -2000 }];
const CENTRE = { x: TA.x + TA.w / 2, y: TA.y + TA.h / 2 };
function varC(t) {
  const POSE = 2.0;
  const cam = camera(CAM_C, t);
  const plonge = seg(2.75, 3.1, t);
  dessineCarte(t); anciennePhrase(t);
  // la page des trophees : on y arrive sur la carte, puis la camera recule jusqu'a la page entiere
  if (t > 2.75) {
    const rec = E.expoInOut(seg(5.45, 6.25, t));
    const s = lerp(2.4, 1, rec);
    const ox = lerp(W / 2 - CENTRE.x * s, 0, rec), oy = lerp(H / 2 - CENTRE.y * s, 0, rec);
    ctx.save();
    ctx.globalAlpha = E.quartOut(seg(2.75, 3.05, t));
    ctx.translate(ox, oy); ctx.scale(s, s);
    ctx.drawImage(IM.pageAvant, 0, 0, W, H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = E.quartOut(seg(2.75, 3.05, t));
    carteTrophee(t, ox + CENTRE.x * s, oy + CENTRE.y * s, s, 3.5, 4.3, 4.35);
    ctx.restore();
  }
  logo(t, 1 - seg(2.6, 2.9, t));
  phrase(t, 0.95, 2.45);
  if (t > SORTIE + 0.2 && plonge < 1) {
    ctx.save();
    ctx.globalAlpha = 1 - plonge;
    metCam(cam);
    const a0 = arrivee(t, 0.75, 0);
    ctx.save(); ctx.translate(0, a0.dy); entete(a0.op); ctx.restore();
    [0, 1, 2, 4].forEach(i => { const a = arrivee(t, 0.75, i + 1); ligne(i, slotY[i] + a.dy, TB.lignes[i].n, a.op * (1 - plonge)); });
    ligne(ALEX, slotY[3], N_ALEX, (t >= POSE ? 1 : 0) * (1 - plonge));
    rangs(null);
    ctx.restore();
  }
  compteur(t, { t0: 1.35, t1: POSE, px: 14 * ZOOM * 1.4, cible: () => {
    const l = TB.lignes[ALEX];
    return versEcran(CAM_C[0], l.score.x + l.score.w, slotY[3] + (l.score.y - l.y) + 11.4);
  } });
}

// --- d : Qui a vu quoi -----------------------------------------------------------------------
const GS = 1.4, GX = 87;
const COL_ALEX = GR.noms.indexOf('Alex');
function varD(t) {
  const POSE = 2.0, MONTE = 2.55, MONTE1 = 3.25, V0 = 3.2, V1 = 5.3, HALO = 5.55;
  dessineCarte(t); anciennePhrase(t); logo(t); phrase(t, 0.95);
  const m = E.expoInOut(seg(MONTE, MONTE1, t));
  // le classement monte et sort, la grille arrive sous lui
  if (t > SORTIE + 0.2 && m < 1) {
    const y0 = 262 - m * 900;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 240, W, H); ctx.clip();
    ctx.translate(87, y0); ctx.scale(1.4, 1.4);
    const a0 = arrivee(t, 0.75, 0);
    ctx.save(); ctx.translate(0, a0.dy); entete(a0.op); ctx.restore();
    [0, 1, 2, 4].forEach(i => { const a = arrivee(t, 0.75, i + 1); ligne(i, slotY[i] + a.dy, TB.lignes[i].n, a.op); });
    ligne(ALEX, slotY[3], N_ALEX, t >= POSE ? 1 : 0);
    rangs(null);
    ctx.restore();
  }
  if (t > MONTE) {
    const gy = lerp(H + 40, 262, m);
    ctx.save();
    ctx.translate(GX, gy); ctx.scale(GS, GS);
    ctx.drawImage(IM.grilleVide, 0, 0, GR.w, GR.h);
    // chaque case vue se pose, colonne apres colonne ; celle d'Alex en dernier
    const cols = GR.noms.length - 1;
    const ordreCol = c => (c === COL_ALEX ? cols - 1 : (c > COL_ALEX ? c - 2 : c - 1));
    for (const c of GR.cases) {
      if (!c.vu) continue;
      const ts = V0 + (V1 - V0 - 0.3) * (ordreCol(c.c) + c.l / 12) / cols;
      if (t < ts) continue;
      const k = Math.min(1, spring(t - ts, 0.5, 30));   // sans depassement : une case ne deborde pas sur ses voisines
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
      ctx.drawImage(IM.grillePleine, c.x * 2, c.y * 2, c.w * 2, c.h * 2, c.x, c.y, c.w, c.h);
      ctx.restore();
    }
    const co = GR.cases.filter(c => c.c === COL_ALEX);
    if (t > HALO) {
      const k = E.expoOut(seg(HALO, HALO + 0.35, t));
      const x = co[0].x, w = co[0].w;
      ctx.strokeStyle = L.accent; ctx.lineWidth = 2.2;
      const r = new Path2D(); r.roundRect(x, 0, w, GR.h * k, 4);
      ctx.stroke(r);
    }
    ctx.restore();
  }
  compteur(t, { t0: 1.35, t1: POSE, px: 14 * ZOOM * 1.4, cible: () => {
    const l = TB.lignes[ALEX];
    return versEcran({ s: 1.4, x: 87, y: 262 }, l.score.x + l.score.w, slotY[3] + (l.score.y - l.y) + 11.4);
  } });
}

// --- e : le montage retenu par Mathis (2026-10-31) ----------------------------------------------
// La fenetre du trophee s'efface, le logo du site glisse a la place de celui du film, le compteur
// revient, vole dans la ligne d'Alex, qui remonte jusqu'a la tete ; le classement monte, la grille le remplace.
const CAM_E = [{ t0: 0, t1: 0, s: 1.4, x: 87, y: 262 }, { t0: 1.75, t1: 2.25, s: 2.05, x: 60, y: 245 }, { t0: 3.7, t1: 4.1, s: 1.4, x: 87, y: 262 }];
const LOGO_SITE = { x: 317, y: 21, taille: 47 };
function logoPorte(t) {
  const k = E.expoInOut(seg(0, 0.7, t));
  const s = lerp(LOGO_SITE.taille / 66, 1, k);
  ctx.save();
  // apparait une fois la page effacee : le nom du site est plus petit que celui du film, les deux se doublaient
  ctx.globalAlpha = seg(0.35, 0.55, t);
  ctx.translate(lerp(LOGO_SITE.x, 56, k) - 56 * s, lerp(LOGO_SITE.y, 28, k) - 28 * s);
  ctx.scale(s, s);
  ctx.drawImage(IM.logo, 0, 0, W, H);
  ctx.restore();
}
// Les lignes sont prises a leur place finale, Alex en tete : le fond et le numero de leur case de rang
// se repeignent selon la place qu'elles occupent a l'instant.
const AUTRES = TB.lignes.map((_, i) => i).filter(i => i !== ALEX);
const PASSE = [0.6, 0.49, 0.425, 0.36];          // l'instant ou Alex depasse chacun, depuis le debut de sa montee
function caseRang(i, y, place, op) {
  const l = TB.lignes[i], r = l.rang, P = TB.lignes[place];
  const x0 = l.moi ? r.x + 3 : r.x;
  const fond = /, 0\)$|transparent/.test(P.fondRang) ? '#fff' : P.fondRang;
  ctx.save();
  ctx.globalAlpha = op;
  ctx.fillStyle = fond; ctx.fillRect(x0, y + 0.5, r.w - (x0 - r.x) - 0.5, r.h - 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = texte(700, 13 * ZOOM);
  ctx.fillStyle = P.coulRang;
  ctx.fillText(P.rangTxt, r.x + r.w / 2, y + r.h / 2 + 0.5);
  ctx.restore();
}
function varE(t) {
  const VOL = 0.95, POSE = 1.6, DOUBLE = 2.45, MONTE = 4.1, MONTE1 = 4.8, V0 = 4.75, V1 = 6.7, HALO = 6.95;
  const sort = E.cubicInOut(seg(0.05, 0.5, t));
  if (sort < 1) {
    ctx.save();
    ctx.globalAlpha = 1 - sort;
    ctx.translate(W / 2, H / 2); ctx.scale(1 + 0.04 * sort, 1 + 0.04 * sort); ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(IM.tro, 0, 0, W, H);
    ctx.restore();
  }
  const kA = E.expoInOut(seg(DOUBLE, DOUBLE + 0.85, t));
  const m = E.expoInOut(seg(MONTE, MONTE1, t));
  if (t > 0.35 && m < 1) {
    const cam = camera(CAM_E, t);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 240, W, H); ctx.clip();
    ctx.translate(cam.x, cam.y - m * 900); ctx.scale(cam.s, cam.s);
    const a0 = arrivee(t, 0.4, 0);
    ctx.save(); ctx.translate(0, a0.dy); entete(a0.op); ctx.restore();
    AUTRES.forEach((i, j) => {
      const a = arrivee(t, 0.4, j + 1);
      // poussee d'une place a l'instant ou la ligne d'Alex la depasse
      const passe = t > DOUBLE + PASSE[j];
      const y = (passe ? lerp(slotY[j], slotY[j + 1], spring(t - DOUBLE - PASSE[j], 0.5, 20)) : slotY[j]) + a.dy;
      ligne(i, y, TB.lignes[i].n, a.op);
      caseRang(i, y, passe ? j + 1 : j, a.op);
    });
    if (t >= POSE) {
      const p = spring(t - POSE, 0.5, 26);
      const op = clamp((t - POSE) / 0.08, 0, 1);
      const y = lerp(slotY[4], slotY[0], kA);
      ctx.save();
      ctx.shadowColor = t > DOUBLE && t < DOUBLE + 0.9 ? 'rgba(21,32,30,0.25)' : 'transparent';
      ctx.shadowBlur = 16;
      ctx.translate(0, (1 - p) * 8);
      ligne(ALEX, y, N_ALEX, op);
      ctx.shadowColor = 'transparent';
      caseRang(ALEX, y, Math.round((y - slotY[0]) / (slotY[1] - slotY[0])), op);
      ctx.restore();
    }
    ctx.restore();
  }
  if (t > MONTE) {
    const gy = lerp(H + 40, 262, m);
    ctx.save();
    ctx.translate(GX, gy); ctx.scale(GS, GS);
    ctx.drawImage(IM.grilleVide, 0, 0, GR.w, GR.h);
    const cols = GR.noms.length - 1;
    const ordreCol = c => (c === COL_ALEX ? cols - 1 : (c > COL_ALEX ? c - 2 : c - 1));
    for (const c of GR.cases) {
      if (!c.vu) continue;
      const ts = V0 + (V1 - V0 - 0.3) * (ordreCol(c.c) + c.l / 12) / cols;
      if (t < ts) continue;
      const k = Math.min(1, spring(t - ts, 0.5, 30));
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
      ctx.drawImage(IM.grillePleine, c.x * 2, c.y * 2, c.w * 2, c.h * 2, c.x, c.y, c.w, c.h);
      ctx.restore();
    }
    if (t > HALO) {
      const co = GR.cases.filter(c => c.c === COL_ALEX);
      const k = E.expoOut(seg(HALO, HALO + 0.35, t));
      ctx.strokeStyle = L.accent; ctx.lineWidth = 2.2;
      const r = new Path2D(); r.roundRect(co[0].x, 0, co[0].w, GR.h * k, 4);
      ctx.stroke(r);
    }
    ctx.restore();
  }
  logoPorte(t);
  phrase(t, 0.55);
  compteur(t, { t0: VOL, t1: POSE, entree: 0.2, px: 14 * ZOOM * 1.4, cible: tt => {
    const l = TB.lignes[ALEX];
    return versEcran(camera(CAM_E, tt), l.score.x + l.score.w, slotY[4] + (l.score.y - l.y) + 11.4);
  } });
}

// --- f : la fiche et le chant -------------------------------------------------------------------
// Une espece que les amis ont vue et pas Alex : le clic ouvre la vraie fiche. Elle defile jusqu'a la carte, la
// fleche passe sur les mois et la carte change avec eux ; l'onglet Sons, puis la lecture du chant.
const FI = window.M3.fiche;
const FS = 1.4, ENTETE_F = 203;                  // l'entete et les onglets de la fiche restent en place au defilement
const FLECHE = new Path2D('M0 0 L0 34 L9 26 L15 40 L22 37 L16 23 L28 23 Z');
function curseur(x, y, presse, op = 1) {
  if (op <= 0) return;
  ctx.save();
  ctx.globalAlpha = op;
  ctx.translate(x, y); ctx.scale(1.5 * (1 - 0.15 * presse), 1.5 * (1 - 0.15 * presse));
  ctx.shadowColor = 'rgba(21,32,30,0.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#fff'; ctx.fill(FLECHE);
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = L.ink; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke(FLECHE);
  ctx.restore();
}
function phraseBloc(t, t0, lignes, sortie) {
  if (t < t0) return;
  const part = sortie === undefined ? 0 : E.expoIn(seg(sortie, sortie + 0.35, t));
  if (part >= 1) return;
  ctx.save();
  ctx.font = titre(104); ctx.textBaseline = 'alphabetic';
  lignes.forEach((ligne, li) => {
    for (let i = 0; i < ligne.length; i++) {
      const g = OM.letterDrop(t, t0 + li * 0.08, i, { stagger: 0.022, dist: 60, squash: 0.0075 });
      if (g.op <= 0.01) continue;
      ctx.save();
      ctx.globalAlpha = g.op * (1 - part);
      ctx.translate(74 + ctx.measureText(ligne.slice(0, i)).width, 310 + li * 120 + g.y - 70 * part);
      ctx.scale(g.sx, g.sy);
      ctx.fillStyle = li === lignes.length - 1 ? L.accent : L.ink;
      ctx.fillText(ligne[i], 0, 0);
      ctx.restore();
    }
  });
  ctx.restore();
}
const F = { CLIC: 1.0, OUVRE: 1.05, OUVRE_FIN: 1.55, DEFILE: 2.15, DEFILE_FIN: 2.75, MOIS: 2.95, PAS: 0.19, SONS: 5.75, JOUE: 6.75, JOUE_FIN: 9.2 };
const MOIS_FIN = F.MOIS + 0.3 + 12 * F.PAS;
function moisCourant(t) {
  if (t < F.MOIS + 0.3) return 0;
  return Math.min(12, 1 + Math.floor((t - F.MOIS - 0.3) / F.PAS));
}
function varF(t) {
  const grille = E.cubicInOut(seg(F.OUVRE, F.OUVRE_FIN, t));
  ctx.save();
  ctx.globalAlpha = 1 - grille;   // entierement : son fantome genait la lecture de la phrase
  ctx.translate(GX, 262); ctx.scale(GS, GS);
  ctx.drawImage(IM.grillePleine, 0, 0, GR.w, GR.h);
  const co = GR.cases.filter(c => c.c === COL_ALEX);
  ctx.strokeStyle = L.accent; ctx.lineWidth = 2.2;
  const r = new Path2D(); r.roundRect(co[0].x, 0, co[0].w, GR.h, 4); ctx.stroke(r);
  // la ligne de l'espece : vue par les trois amis, la case d'Alex est vide
  const ca = GR.cases.find(c => c.l === 0 && c.c === COL_ALEX);
  const ap = seg(0.25, 0.5, t) * (1 - seg(F.OUVRE, F.OUVRE + 0.2, t));
  if (ap > 0) {
    ctx.save();
    ctx.globalAlpha = (1 - grille) * ap;
    ctx.fillStyle = 'rgba(11,124,119,0.14)'; ctx.fillRect(0, ca.y, GR.w, ca.h);
    ctx.strokeStyle = L.accent; ctx.lineWidth = 2.4;
    const k = new Path2D(); k.roundRect(ca.x + 1, ca.y + 1, ca.w - 2, ca.h - 2, 3); ctx.stroke(k);
    ctx.restore();
  }
  ctx.restore();
  logo(t);
  phrase(t, -5, F.OUVRE);
  phraseBloc(t, 1.45, ['Sache où', 'et quand', 'le trouver.'], F.SONS - 0.1);
  phraseBloc(t, F.SONS + 0.2, ['Reconnais-le', 'à son', 'chant.']);
  // le tiroir de la fiche
  const dx = lerp(W + 40, W - FI.w * FS, E.expoOut(seg(F.OUVRE, F.OUVRE_FIN, t)));
  const defile = t < F.SONS ? (FI.bloc.y - ENTETE_F - 10) * E.expoInOut(seg(F.DEFILE, F.DEFILE_FIN, t)) : 0;
  const ecranX = x => dx + x * FS, ecranY = (y, fixe) => (y - (fixe ? 0 : defile)) * FS;
  if (t > F.OUVRE) {
    const im = t < F.SONS ? IM.ficheInfo : IM.ficheSons;
    ctx.save();
    ctx.translate(dx, 0); ctx.scale(FS, FS);
    ctx.save();
    ctx.shadowColor = 'rgba(21,32,30,0.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetX = -10;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, FI.w, H / FS);
    ctx.restore();
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(im, 0, -defile, FI.w, FI.h);
    if (t < F.SONS && t >= F.MOIS) ctx.drawImage(IM['mois' + moisCourant(t)], FI.bloc.x, FI.bloc.y - defile, FI.bloc.w, FI.bloc.h);
    ctx.drawImage(im, 0, 0, FI.w * 2, ENTETE_F * 2, 0, 0, FI.w, ENTETE_F);
    ctx.restore();
  }
  // la lecture du chant : le curseur de lecture parcourt le spectrogramme
  const E0 = FI.enregistrements[0];
  if (t >= F.JOUE) {
    const b = E0.barre, l = E0.lecture;
    const k = seg(F.JOUE, F.JOUE_FIN, t);
    const bx = ecranX(b.x), by = ecranY(b.y, true), bw = b.w * FS, bh = b.h * FS;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(bx, by, bw * k, bh);
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + bw * k - 1.5, by, 3, bh);
    // le bouton passe en pause, comme sur le site
    const cx = ecranX(l.x + l.w / 2), cy = ecranY(l.y + l.h / 2, true);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, l.w * FS / 2 - 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = L.ink; ctx.fillRect(cx - 9, cy - 11, 6, 22); ctx.fillRect(cx + 3, cy - 11, 6, 22);
    ctx.restore();
  }
  // la fleche : la case, les mois, l'onglet Sons, la lecture
  const nom = GR.cases.find(c => c.l === 0 && c.c === 1);
  const chemin = [
    { t0: 0.1, t1: F.CLIC - 0.03, x: GX + 90, y: 262 + (nom.y + nom.h / 2) * GS },
  ];
  const pa = FI.pastilles;
  const surMois = k => [ecranX(pa[k].x + pa[k].w * 0.7), ecranY(pa[k].y + pa[k].h * 0.6)];
  let cxc = lerp(1300, chemin[0].x, E.expoInOut(seg(chemin[0].t0, chemin[0].t1, t)));
  let cyc = lerp(1000, chemin[0].y, E.expoInOut(seg(chemin[0].t0, chemin[0].t1, t)));
  if (t > F.DEFILE + 0.1) {
    const [mx, my] = surMois(moisCourant(t));
    const k = E.cubicInOut(seg(F.DEFILE + 0.1, F.MOIS, t));
    cxc = lerp(cxc, mx, k); cyc = lerp(cyc, my, k);
  }
  if (t > MOIS_FIN) {
    const k = E.expoInOut(seg(MOIS_FIN + 0.05, F.SONS - 0.03, t));
    cxc = lerp(cxc, ecranX(FI.sons.x + FI.sons.w / 2), k); cyc = lerp(cyc, ecranY(FI.sons.y + FI.sons.h / 2, true), k);
  }
  if (t > F.SONS + 0.3) {
    const l = E0.lecture;
    const k = E.expoInOut(seg(F.SONS + 0.3, F.JOUE - 0.03, t));
    cxc = lerp(cxc, ecranX(l.x + l.w / 2), k); cyc = lerp(cyc, ecranY(l.y + l.h / 2, true), k);
  }
  const clics = [F.CLIC, F.SONS, F.JOUE];
  let presse = 0;
  clics.forEach(c => { if (t >= c) presse = Math.max(presse, clamp(1 - Math.abs(t - c - 0.06) / 0.08, 0, 1)); });
  curseur(cxc + 6, cyc + 6, presse, seg(0.02, 0.2, t) * (1 - seg(F.JOUE + 0.4, F.JOUE + 0.7, t)));
}

// --- g : les observations recentes, puis le quiz -------------------------------------------------
// Le tiroir sort. La carte de la Bretagne monte, ses points se posent, les oiseaux rares arrivent dans le panneau.
// Puis une vraie manche du quiz : le chant joue, la fleche choisit, le site repond.
const RE = window.M3.recent;
const G = { MONTE: 0.3, POINTS: 1.05, POINTS_FIN: 2.4, SORT: 3.95, QUIZ: 4.0, QUIZ_FIN: 4.6, CLIC: 6.2 };
const RS = 1.536, RY = 246, PX = W - RE.panneau.width * RS;   // la carte, puis son panneau a droite
// du plus loin au plus pres de Rennes : ils arrivent depuis la pointe, dans le sens de la lecture
const ORDRE_R = RE.points.map((_, i) => i).sort((a, b) => RE.points[a].x - RE.points[b].x);
const QS = 1.34, QX = W - RE.cadreQuiz.width * QS - 40, QY = 48;
function phraseUne(t, t0, texteP, debutAccent, sortie) {
  if (t < t0) return;
  const part = sortie === undefined ? 0 : E.expoIn(seg(sortie, sortie + 0.35, t));
  if (part >= 1) return;
  ctx.save();
  ctx.font = titre(84); ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < texteP.length; i++) {
    const g = OM.letterDrop(t, t0, i, { stagger: 0.02, dist: 50, squash: 0.0075 });
    if (g.op <= 0.01) continue;
    ctx.save();
    ctx.globalAlpha = g.op * (1 - part);
    ctx.translate(74 + ctx.measureText(texteP.slice(0, i)).width, 208 + g.y - 60 * part);
    ctx.scale(g.sx, g.sy);
    ctx.fillStyle = i >= debutAccent ? L.accent : L.ink;
    ctx.fillText(texteP[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}
function varG(t) {
  // le mur de l'Australie s'en va
  const mx = lerp(MUR_X, W + 60, E.expoIn(seg(0.05, 0.5, t)));
  if (mx < W) murMonde(mx);
  phraseBloc(t, -5, PHRASE_M, 0.02);
  // la Bretagne
  const sortie = E.expoIn(seg(G.SORT, G.SORT + 0.4, t));
  if (t > G.MONTE && sortie < 1) {
    const k = spring(t - G.MONTE, 0.6, 22);
    ctx.save();
    ctx.globalAlpha = clamp((t - G.MONTE) / 0.12, 0, 1) * (1 - sortie);
    ctx.translate(0, RY + (1 - k) * 700 - sortie * 120);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(IM.rFond, 0, 0, RE.carte.w, RE.carte.h);
    // OpenStreetMap : la mention dans un coin de la carte, en plus des credits
    ctx.font = texte(500, 20); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(RE.carte.w - 186, RE.carte.h - 34, 186, 34);
    ctx.fillStyle = L.ink; ctx.fillText('\u00a9 OpenStreetMap', RE.carte.w - 12, RE.carte.h - 10);
    ctx.textAlign = 'left';
    ORDRE_R.forEach((i, n) => {
      const q = RE.points[i];
      const ts = G.POINTS + (G.POINTS_FIN - G.POINTS) * n / (ORDRE_R.length - 1);
      if (t < ts) return;
      const p = spring(t - ts, 0.5, 30);
      const cx = q.x + q.w / 2, cy = q.y + q.h / 2;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(p, p);
      ctx.drawImage(IM['p' + i], -q.w / 2, -q.h / 2, q.w, q.h);
      ctx.restore();
    });
    // les oiseaux rares arrivent dans le panneau : le fond sans rangees est une case blanche, on les decouvre
    ctx.translate(PX, 0); ctx.scale(RS, RS);
    const bord = new Path2D(); bord.roundRect(1, 0, RE.panneau.width - 1, RE.panneau.height, 12);
    ctx.clip(bord);
    ctx.drawImage(IM.rPlein, 0, 0, RE.panneau.width, RE.panneau.height);
    const ech = IM.rPlein.width / RE.panneau.width;
    RE.rangees.forEach((r, n) => {
      const ts = G.POINTS + 0.25 + n * 0.17;
      const a = E.cubicOut(seg(ts, ts + 0.22, t));
      ctx.save();
      ctx.fillStyle = '#fff'; ctx.fillRect(r.x, r.y, r.w, r.h);
      if (a > 0) {
        ctx.globalAlpha = a;
        ctx.translate(14 * (1 - a), 0);
        ctx.drawImage(IM.rPlein, r.x * ech, r.y * ech, r.w * ech, r.h * ech, r.x, r.y, r.w, r.h);
      }
      ctx.restore();
    });
    ctx.restore();
  }
  logo(t);
  phraseUne(t, 0.6, 'Vois ce qui passe près de chez toi.', 22, G.SORT - 0.1);
  // Le clic sur le plus gros point : sa vraie liste s'ouvre au-dessus de lui, le temps de la lire
  if (TF > 3.54 && TF < 5.94) {
    const q = RE.points[RE.spot.i], s = 1.05;
    const mx = q.x + q.w / 2, my = RY + q.y + q.h / 2;
    const CLIC_S = 4.25;
    const k = E.expoInOut(seg(3.56, CLIC_S - 0.03, TF));
    const presse = TF >= CLIC_S ? clamp(1 - Math.abs(TF - CLIC_S - 0.06) / 0.08, 0, 1) : 0;
    const ouvre = TF > CLIC_S ? spring(TF - CLIC_S, 0.55, 26) : 0;
    const op = clamp((TF - CLIC_S) / 0.1, 0, 1) * (1 - seg(5.65, 5.9, TF));
    if (op > 0) {
      const w = RE.spot.w * s, h = RE.spot.h * s;
      ctx.save();
      ctx.globalAlpha = op;
      ctx.translate(mx, my - q.h / 2 + 2); ctx.scale(ouvre, ouvre); ctx.translate(-mx, -(my - q.h / 2 + 2));
      ctx.imageSmoothingQuality = 'high';
      ctx.shadowColor = 'rgba(21,32,30,0.25)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
      ctx.drawImage(IM.spot, mx - w / 2, my - q.h / 2 + 2 - h, w, h);
      ctx.restore();
    }
    curseur(lerp(900, mx + 6, k), lerp(1120, my + 6, k), presse, 1 - seg(5.0, 5.3, TF));
  }
  phraseBloc(t, G.QUIZ + 0.35, ['Entraîne-toi', 'à les', 'reconnaître.']);
  // le quiz
  if (t > G.QUIZ) {
    const x = lerp(W + 60, QX, E.expoOut(seg(G.QUIZ, G.QUIZ_FIN, t)));
    const c = new Path2D(); c.roundRect(x - 14, QY - 14, RE.cadreQuiz.width * QS + 28, RE.cadreQuiz.height * QS + 28, 18);
    ctx.save();
    ctx.shadowColor = 'rgba(21,32,30,0.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    ctx.fillStyle = '#fff'; ctx.fill(c);
    ctx.restore();
    ctx.save();
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(IM.qQuestion, x, QY, RE.cadreQuiz.width * QS, RE.cadreQuiz.height * QS);
    const rep = seg(G.CLIC + 0.04, G.CLIC + 0.14, t);
    if (rep > 0) { ctx.globalAlpha = rep; ctx.drawImage(IM.qReponse, x, QY, RE.cadreQuiz.width * QS, RE.cadreQuiz.height * QS); }
    ctx.restore();
    // le chant joue : une onde part du bouton de lecture, jusqu'a la reponse
    const l = RE.quiz.lecture, lx = x + (l.x + l.w / 2) * QS, ly = QY + (l.y + l.h / 2) * QS;
    if (t < G.CLIC) [0, 0.5, 1.0].forEach(d => {
      const u = ((t - G.QUIZ_FIN - d) % 1.5 + 1.5) % 1.5 / 1.5;
      if (t < G.QUIZ_FIN + d) return;
      ctx.save();
      ctx.globalAlpha = (1 - u) * 0.5;
      ctx.strokeStyle = L.accent2; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(lx, ly, l.w * QS / 2 + u * 34, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });
    // la fleche choisit la bonne reponse
    if (t > 5.0) {
      const b = RE.quiz.choix[0];
      const k = E.expoInOut(seg(5.05, G.CLIC - 0.03, t));
      const presse = t >= G.CLIC ? clamp(1 - Math.abs(t - G.CLIC - 0.06) / 0.08, 0, 1) : 0;
      curseur(lerp(1500, x + (b.x + b.w * 0.45) * QS, k), lerp(1120, QY + (b.y + b.h * 0.6) * QS, k), presse, 1 - seg(G.CLIC + 0.5, G.CLIC + 0.8, t));
    }
  }
}

// --- m : le monde entier -------------------------------------------------------------------------
// Le tiroir sort. Le vrai selecteur de pays defile, continent par continent, la fleche choisit l'Australie, et le
// mur de ce pays arrive : l'Emeu, le Casoar, tout ce qui reste a decouvrir.
const MO = window.M3.monde;
const PHRASE_M = ['Découvre', 'les oiseaux', 'du monde', 'entier.'];
const MS = 1.6, MXL = W - MO.modale.w * MS - 110, MYL = 40, MFEN = (H - 2 * MYL) / MS;
const MUR_S = (W - 650 - 30) / MO.cadreMur.width, MUR_X = 650, MUR_Y = 40;
function murMonde(x, op = 1) {
  const w = MO.cadreMur.width * MUR_S, h = MO.cadreMur.height * MUR_S;
  const c = new Path2D(); c.roundRect(x, MUR_Y, w, H - MUR_Y - 30, 16);
  ctx.save();
  ctx.globalAlpha = op;
  ctx.shadowColor = 'rgba(21,32,30,0.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#fff'; ctx.fill(c);
  ctx.shadowColor = 'transparent';
  ctx.clip(c);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(IM.mMur, x, MUR_Y, w, h);
  ctx.restore();
}
function varM(t) {
  const dx = lerp(W - FI.w * FS, W + 60, E.expoIn(seg(0.05, 0.5, t)));
  if (dx < W) {
    ctx.save();
    ctx.translate(dx, 0); ctx.scale(FS, FS);
    ctx.drawImage(IM.ficheSons, 0, 0, FI.w, FI.h);
    ctx.restore();
  }
  logo(t);
  phraseBloc(t, -5, ['Reconnais-le', 'à son', 'chant.'], 0.02);
  phraseBloc(t, 0.4, PHRASE_M);
  const CLIC_M = 3.5, FIN_L = 3.6;
  const sortie = E.expoIn(seg(FIN_L, FIN_L + 0.4, t));
  if (t > 0.35 && sortie < 1) {
    const x = lerp(W + 60, MXL, E.expoOut(seg(0.35, 0.9, t))) + sortie * 900;
    const hautFixe = MO.recherche.y + MO.recherche.h + 8;
    const maxi = MO.modale.h - MFEN;
    const defile = maxi * E.cubicInOut(seg(1.1, 3.1, t));
    const c = new Path2D(); c.roundRect(x, MYL, MO.modale.w * MS, MFEN * MS, 18);
    ctx.save();
    ctx.shadowColor = 'rgba(21,32,30,0.22)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    ctx.fillStyle = '#fff'; ctx.fill(c);
    ctx.shadowColor = 'transparent';
    ctx.clip(c);
    ctx.translate(x, MYL); ctx.scale(MS, MS);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(IM.mListe, 0, -defile, MO.modale.w, MO.modale.h);
    const ci = MO.cible;
    if (t > 3.15) { ctx.fillStyle = 'rgba(11,124,119,0.13)'; ctx.fillRect(ci.x, ci.y - defile, ci.w, ci.h); }
    // l'entete et la recherche restent en place
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, MO.modale.w, hautFixe);
    ctx.drawImage(IM.mListe, 0, 0, MO.modale.w * 2, hautFixe * 2, 0, 0, MO.modale.w, hautFixe);
    ctx.restore();
    const presse = t >= CLIC_M ? clamp(1 - Math.abs(t - CLIC_M - 0.06) / 0.08, 0, 1) : 0;
    const k = E.expoInOut(seg(2.75, CLIC_M - 0.03, t));
    if (t > 2.75) curseur(lerp(1880, x + (ci.x + ci.w * 0.3) * MS, k), lerp(1120, MYL + (ci.y + ci.h * 0.5 - defile) * MS, k), presse, 1 - sortie);
  }
  if (t > FIN_L + 0.05) murMonde(lerp(W + 40, MUR_X, E.expoOut(seg(FIN_L + 0.05, FIN_L + 0.65, t))));
}

const VAR = { a: varA, b: varB, c: varC, d: varD, e: varE, f: varF, g: varG, m: varM }[V];
function seek(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = L.ground;
  ctx.fillRect(0, 0, W, H);
  VAR(tempsComp(t));
  return true;
}
// les plages ou ca bouge, et de combien au plus : hors d'elles, les images sont de vrais repos
const ACTIF = {
  a: [[0.5, 3.6, 90], [3.95, 5.6, 60]],
  b: [[0.5, 5.2, 40], [5.4, 6.2, 90]],
  c: [[0.5, 2.3, 90], [2.5, 4.7, 200], [5.45, 6.3, 120]],
  d: [[0.5, 2.3, 90], [2.55, 3.3, 120], [3.2, 6.0, 30]],
  e: [[0, 1.0, 90], [0.95, 3.4, 90], [3.7, 4.9, 120], [4.75, 7.4, 30]],
  f: [[0.1, 1.0, 60], [1.05, 1.6, 200], [2.15, 2.8, 120], [2.25, 5.75, 30], [5.75, 6.75, 60], [6.75, 7.5, 16]],
  m: [[0, 1.0, 120], [1.1, 3.1, 90], [2.75, 3.6, 60], [3.6, 4.3, 200]],
  g: [[0, 1.0, 120], [1.05, 2.9, 20], [3.95, 4.7, 150], [4.7, 6.3, 40], [6.3, 7.1, 16]],
}[V];
window.__motion = (t0, t1) => {
  let px = 0;
  const u0 = tempsComp(t0), u1 = tempsComp(t1);
  if (V === 'g' && t1 > 3.54 && t0 < 5.94) return 60;
  for (const [a, b, p] of ACTIF) if (u1 > a && u0 < b) px = Math.max(px, p);
  return px;
};
window.__track = () => ({ logo: { x: 56, y: 28, w: 66, h: 66, op: 1 } });
window.__events = () => ({ T: DUR, events: [], silences: [] });
window.__seek = async t => seek(t);

function charge(cle, src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { IM[cle] = im; res(); };
    im.onerror = () => { console.warn('image absente : ' + src); res(); };
    im.src = src;
  });
}
window.__ready = (async () => {
  const jobs = [charge('carte', 'carte-nue.png'), charge('logo', 'logo-nom.png'), charge('entete', 'table-entete.png'),
    charge('grilleVide', 'grille-vide.png'), charge('grillePleine', 'grille-pleine.png'),
    charge('tro', 'trophee-fin.jpg'), charge('pageAvant', 'page-trophees-avant.png'), charge('mpAvant', 'carte-mp-avant.png'), charge('mpApres', 'carte-mp-apres.png')];
  TB.lignes.forEach((l, i) => jobs.push(charge('l' + i, 'ligne-' + i + '.png')));
  if (V === 'm') jobs.push(charge('ficheSons', 'fiche-sons.png'), charge('mListe', 'monde-liste.png'), charge('mMur', 'monde-mur.png'));
  if (V === 'g') {
    jobs.push(charge('mMur', 'monde-mur.png'), charge('rFond', 'recent-fond.png'), charge('rPlein', 'recent-panneau.png'), charge('spot', 'spot-liste.png'), charge('qQuestion', 'quiz-question.png'), charge('qReponse', 'quiz-reponse.png'));
    window.M3.recent.points.forEach((_, i) => jobs.push(charge('p' + i, 'point-' + i + '.png')));
  }
  if (V === 'f') {
    jobs.push(charge('ficheInfo', 'fiche-info.png'), charge('ficheSons', 'fiche-sons.png'));
    window.M3.fiche.pastilles.forEach((_, k) => jobs.push(charge('mois' + k, 'mois-' + String(k).padStart(2, '0') + '.png')));
  }
  document.fonts.add(await new FontFace('Source Serif Film', 'url(' + window.POLICE_TITRE + ')', { weight: '700' }).load());
  await Promise.all(jobs);
  if (window.LOOK.ready) await window.LOOK.ready;
  await document.fonts.ready;
  return seek(0);
})();
const q = new URLSearchParams(location.search);
if (q.has('play')) window.__ready.then(() => { const t0 = performance.now(); const b = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(b); }; b(); });
else if (q.has('t')) window.__ready.then(() => seek(parseFloat(q.get('t'))));
function ajuste() { document.getElementById('stage').style.transform = 'scale(' + Math.min(innerWidth / W, innerHeight / H) + ')'; }
addEventListener('resize', ajuste); ajuste();
</script>
