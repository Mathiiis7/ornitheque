<!doctype html>
<meta charset="utf-8">
<title>L'Ornitheque - film de presentation, deroule v2</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  canvas{display:block;width:1920px;height:1080px}
</style>
<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>

<script src="motion.js"></script>
<script src="donnees-v2.js"></script>
<script src="police-v2.js"></script>
<script src="look.js"></script>
<script>
// =============================================================================
// L'Ornitheque - deroule v2 (docs/VIDEO-DEROULE-V2.md), moments 1 et 2.
//
//   1. Ouverture : le cadre du logo arrive, le martin se dessine trace par trace, ses points
//      eclatent en salve, l'oeil s'ouvre, le nom tombe, puis un vrai repos.
//   2. Observer : un iris s'ouvre depuis l'oeil sur la carte du site ; le logo et le nom se
//      rangent en haut a gauche et RESTENT (c'est ce qui survit au passage). Les anneaux de la
//      liste du visiteur arrivent par trois salves separees de vrais arrets, le compteur ajoute
//      le nombre de chaque anneau qui se pose (la cause est visible), et s'arrete net sur 199.
//
// Tout vient du site actuel (v2-site.py). Tout est une fonction PURE du temps : le rendu rappelle
// seek(t) plusieurs fois autour de chaque image pour le flou de mouvement.
// =============================================================================

const MODE_FIN = false;   // assemble-v2.py ecrit comp-fin.html avec true : l'ecran de fin, memes traces, meme police
const FPS = 30, DUR = MODE_FIN ? 9.6 : 15.8;
window.__meta = { dur: DUR, fps: FPS, w: 1920, h: 1080 };
const W = 1920, H = 1080;
const { clamp, lerp, ssstep, spring } = OM;
const E = OM.ease;
const seg = (a, b, t) => clamp((t - a) / (b - a), 0, 1);

const L = (window.LOOK && window.LOOK.color) ? window.LOOK.color : {
  ground: '#eef2f1', deep: '#dde4e2', card: '#ffffff', line: '#d8dddc',
  mute: '#616966', ink: '#15201e', accent: '#0b7c77', accent2: '#c05e33',
};
// La police des titres du site, en gras comme son entete.
const police = (r, px) => r === 'display'
  ? '700 ' + px + 'px "Source Serif Film"'
  : ((window.LOOK && window.LOOK.font) ? window.LOOK.font(r, px) : px + 'px "Segoe UI", sans-serif');

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const IM = {};

// --- La feuille de plans --------------------------------------------------------------------
// Le rythme est le reproche du brouillon precedent : tout y avancait a la meme vitesse. Ici des
// salves courtes, separees d'arrets ou RIEN ne bouge, camera comprise.
const T = {
  CADRE: 0.35,                        // le cadre arrive en ressort
  TRACE: 0.55, TRACE_FIN: 1.85,       // les grandes formes se dessinent, vite
  POINTS: 1.9, POINTS_FIN: 2.4,       // les points du plumage eclatent
  OEIL: 2.45,                         // l'oeil s'ouvre
  NOM: 2.7,                           // le nom tombe
  REPOS1: 3.5,                        // repos immobile jusqu'a RANGE
  RANGE: 4.7, RANGE_FIN: 5.6,         // le logo se range d'un coup, l'iris s'ouvre
  PHRASE: 5.35,                       // la phrase du moment
};
// Trois salves d'anneaux : une lente, une qui accelere, un deferlement. Entre elles, l'arret.
const SALVES = [
  { t0: 6.5,  t1: 8.1,  n: 5, puiss: 1 },
  { t0: 8.7,  t1: 10.0, n: 7, puiss: 0.8 },
  { t0: 11.0, t1: 12.3, n: 0, puiss: 0.7 },   // n = 0 : tout le reste
];
const MONTEE = 0.25;                  // le temps que le nombre d'un anneau s'ajoute au compteur
const FIN = 12.3 + MONTEE;            // le compteur est a son total
const TOTAL = window.V2.total, SUR = window.V2.sur;   // « 199 espèces vues sur 467 », lu sur le site par v2-site.py
const PHOTO_VOL = 0.5;
const PHOTOS = [
  { t: 7.15,  tenue: 0.75 },
  { t: 8.85,  tenue: 0.75 },
  { t: 9.3,   tenue: 0.75 },
  { t: 11.4,  tenue: 0.45 },
  { t: 12.42, tenue: 0.35 },   // le rougegorge, depuis le dernier anneau, celui de l'Indre
].map((p, i) => ({ ...p, ...window.V2.photos[i] }));
const COMPTEUR = { x: 80, base: 985 };

// --- Le logo : les vrais traces de assets/logos/logo.svg ------------------------------------
const LG = window.V2.logo;
const svgNS = 'http://www.w3.org/2000/svg';
const mesure = document.createElementNS(svgNS, 'path');
const longueur = d => { mesure.setAttribute('d', d); return mesure.getTotalLength(); };
const boite = d => {
  const n = d.match(/-?\d*\.?\d+/g).map(Number);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i + 1 < n.length; i += 2) { x0 = Math.min(x0, n[i]); x1 = Math.max(x1, n[i]); y0 = Math.min(y0, n[i + 1]); y1 = Math.max(y1, n[i + 1]); }
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
};
const MASQUES = {};
Object.keys(LG.masques).forEach(k => {
  const p = new Path2D();
  LG.masques[k].forEach(d => p.addPath(new Path2D(d)));
  MASQUES[k] = p;
});
const CADRE = new Path2D();
CADRE.roundRect(LG.x, LG.y, LG.w, LG.h, LG.rx);
const OEIL_LOGO = [17.11, 6.01], BEC = [24.9, 6.5];
const TR = LG.traces.map(tr => {
  const b = boite(tr.d);
  return { ...tr, path: new Path2D(tr.d), len: longueur(tr.d), ...b, dist: Math.hypot(b.cx - BEC[0], b.cy - BEC[1]) };
});
// Un petit trace de plumage est un point : il eclate. L'oeil a son propre instant. Le reste se dessine.
const estOeil = tr => Math.hypot(tr.cx - OEIL_LOGO[0], tr.cy - OEIL_LOGO[1]) < 0.75 && ['white', '#120D0A'].includes(tr.fill);
const estPoint = tr => tr.masque && tr.fill === '#29C2BD';
const grandes = TR.filter(tr => !estPoint(tr) && !estOeil(tr)).sort((a, b) => a.dist - b.dist);
grandes.forEach((tr, k) => { tr.ts = T.TRACE + (T.TRACE_FIN - T.TRACE - 0.45) * k / (grandes.length - 1); tr.genre = 'forme'; });
const points = TR.filter(estPoint).sort((a, b) => a.dist - b.dist);
points.forEach((tr, k) => { tr.ts = T.POINTS + (T.POINTS_FIN - T.POINTS - 0.2) * k / (points.length - 1); tr.genre = 'point'; });
TR.filter(estOeil).forEach(tr => { tr.ts = T.OEIL; tr.genre = 'oeil'; });

const POSE_A = { taille: 430, x: 273, y: 325 };
const POSE_B = { taille: 66, x: 56, y: 28 };
function poseLogo(t) {
  const k = E.expoInOut(seg(T.RANGE, T.RANGE_FIN, t));
  const taille = lerp(POSE_A.taille, POSE_B.taille, k);
  return { s: taille / LG.w, taille, x: lerp(POSE_A.x, POSE_B.x, k), y: lerp(POSE_A.y, POSE_B.y, k), k };
}
const oeilEcran = P => [P.x + (OEIL_LOGO[0] - LG.x) * P.s, P.y + (OEIL_LOGO[1] - LG.y) * P.s];

function dessineLogo(t) {
  if (t < T.CADRE) return;
  const P = poseLogo(t);
  const arrive = spring(t - T.CADRE, 0.5, 26);
  ctx.save();
  ctx.translate(P.x + P.taille / 2, P.y + P.taille / 2);
  ctx.scale(arrive, arrive);
  ctx.translate(-P.taille / 2, -P.taille / 2);
  ctx.scale(P.s, P.s);
  ctx.translate(-LG.x, -LG.y);
  ctx.save();
  ctx.clip(CADRE);
  ctx.fillStyle = LG.fond;
  ctx.fill(CADRE);
  ctx.lineJoin = 'round';
  // l'ordre du SVG est garde : l'image finale est le vrai logo, trace pour trace
  for (const tr of TR) {
    if (t < tr.ts) continue;
    ctx.save();
    if (tr.masque) ctx.clip(MASQUES[tr.masque]);
    const dt = t - tr.ts;
    if (tr.stroke) {
      ctx.globalAlpha = tr.op * seg(0, 0.4, dt);
      ctx.strokeStyle = tr.stroke; ctx.lineWidth = tr.sw;
      ctx.stroke(tr.path);
    } else if (tr.genre === 'forme') {
      const trace = E.cubicOut(seg(0, 0.32, dt));
      const remplit = E.quartOut(seg(0.2, 0.42, dt));
      const estompe = seg(0.32, 0.5, dt);
      if (remplit > 0) { ctx.globalAlpha = remplit; ctx.fillStyle = tr.fill; ctx.fill(tr.path); }
      if (estompe < 1) {
        ctx.globalAlpha = 1 - estompe;
        ctx.strokeStyle = L.ink; ctx.lineWidth = 0.05;
        ctx.setLineDash([tr.len * trace, tr.len + 1]);
        ctx.stroke(tr.path);
        ctx.setLineDash([]);
      }
    } else {
      const k = spring(dt, 0.45, tr.genre === 'oeil' ? 22 : 34);
      ctx.translate(tr.cx, tr.cy); ctx.scale(k, k); ctx.translate(-tr.cx, -tr.cy);
      ctx.fillStyle = tr.fill; ctx.fill(tr.path);
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();
}

// --- Le nom ---------------------------------------------------------------------------------
const NOM = 'L’Ornithèque';
const largNom = {};
function xsNom(px) {
  const key = Math.round(px * 4);
  if (largNom[key]) return largNom[key];
  ctx.save(); ctx.font = police('display', px);
  const xs = []; for (let i = 0; i <= NOM.length; i++) xs.push(ctx.measureText(NOM.slice(0, i)).width);
  ctx.restore();
  return (largNom[key] = xs);
}
const NOM_A = { px: 150, x: 753, base: 592 };
const NOM_B = { px: 46, x: 138, base: 76 };
function poseNom(t) {
  const k = E.expoInOut(seg(T.RANGE + 0.03, T.RANGE_FIN, t));
  return { px: lerp(NOM_A.px, NOM_B.px, k), x: lerp(NOM_A.x, NOM_B.x, k), base: lerp(NOM_A.base, NOM_B.base, k) };
}
function dessineNom(t) {
  if (t < T.NOM) return;
  const P = poseNom(t);
  const xs = xsNom(P.px);
  ctx.save();
  ctx.font = police('display', P.px);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = L.ink;
  for (let i = 0; i < NOM.length; i++) {
    const g = OM.letterDrop(t, T.NOM, i, { stagger: 0.035, dist: 70, squash: 0.0075 });
    if (g.op <= 0.01) continue;
    ctx.save();
    ctx.globalAlpha = g.op;
    ctx.translate(P.x + xs[i], P.base + g.y * (P.px / NOM_A.px));
    ctx.scale(g.sx, g.sy);
    ctx.fillText(NOM[i], 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// --- La carte et ses anneaux ----------------------------------------------------------------
const ANN = window.V2.anneaux;
const NA = ANN.length;
// La camera n'avance que pendant les salves, puis s'arrete net : un travelling pendant un repos
// compte comme du mouvement et tue l'effet de l'arret.
const FOCUS = [1180, 540];
function zoomCarte(t) {
  let z = 1;
  for (const s of SALVES) z += 0.018 * E.expoOut(seg(s.t0, s.t1 + 0.2, t));
  return z;
}
const versCarte = (x, y, z) => [FOCUS[0] + (x - FOCUS[0]) * z, FOCUS[1] + (y - FOCUS[1]) * z];

// ordre d'arrivee : melange a graine fixe, reparti dans les salves
const rng = OM.rng(11);
const ordre = ANN.map((_, i) => i);
for (let i = NA - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; }
// le plus gros anneau arrive en dernier : c'est lui qui fait le coup final du compteur
{
  const gros = ordre.reduce((m, i) => (ANN[i].n > ANN[m].n ? i : m), ordre[0]);
  ordre.splice(ordre.indexOf(gros), 1);
  ordre.push(gros);
}
const tArrive = new Array(NA);
{
  let pos = 0;
  SALVES.forEach(s => {
    const n = s.n || (NA - pos);
    s.debut = pos; s.fin = pos + n;
    for (let k = 0; k < n; k++, pos++) tArrive[ordre[pos]] = s.t0 + (s.t1 - s.t0) * Math.pow(n > 1 ? k / (n - 1) : 0, s.puiss);
  });
}

function dessineCarte(t) {
  if (t < T.RANGE) return;
  const z = zoomCarte(t);
  const [ex, ey] = oeilEcran(poseLogo(t));
  const R = E.expoIn(seg(T.RANGE, T.RANGE_FIN, t)) * 2400;
  ctx.save();
  ctx.beginPath(); ctx.arc(ex, ey, R, 0, Math.PI * 2); ctx.clip();
  ctx.save();
  ctx.translate(FOCUS[0], FOCUS[1]); ctx.scale(z, z); ctx.translate(-FOCUS[0], -FOCUS[1]);
  const im = IM.carte;
  if (im) ctx.drawImage(im, 0, 0, W, H);
  for (let i = 0; i < NA; i++) {
    const tau = t - tArrive[i];
    if (tau <= 0) continue;
    const a = ANN[i], g = IM['a' + i];
    if (!g) continue;
    const k = spring(tau, 0.5, 30);
    const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(k, k);
    ctx.drawImage(g, -a.w / 2, -a.h / 2, a.w, a.h);
    ctx.restore();
  }
  ctx.restore();
  // voile : la phrase et le compteur se lisent sur la carte
  const v = ctx.createLinearGradient(0, 0, 900, 0);
  v.addColorStop(0, 'rgba(238,242,241,0.72)'); v.addColorStop(0.6, 'rgba(238,242,241,0.45)'); v.addColorStop(1, 'rgba(238,242,241,0)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, 900, H);
  // OpenStreetMap : quand sa carte tient une grande place dans une video, la mention va dans un coin de la carte
  ctx.font = police('text', 20); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(W - 186, H - 34, 186, 34);
  ctx.fillStyle = L.ink; ctx.fillText('\u00a9 OpenStreetMap', W - 12, H - 10);
  ctx.textAlign = 'left';
  ctx.restore();
}

// --- La phrase ------------------------------------------------------------------------------
const PHRASE = ['Note chaque', 'oiseau que', 'tu vois.'];
const PH_PX = 104, PH_X = 74, PH_Y0 = 310, PH_PAS = 120;
function dessinePhrase(t) {
  if (t < T.PHRASE) return;
  ctx.save();
  ctx.font = police('display', PH_PX);
  ctx.textBaseline = 'alphabetic';
  PHRASE.forEach((ligne, li) => {
    for (let i = 0; i < ligne.length; i++) {
      const g = OM.letterDrop(t, T.PHRASE + li * 0.08, i, { stagger: 0.022, dist: 60, squash: 0.0075 });
      if (g.op <= 0.01) continue;
      const x = PH_X + ctx.measureText(ligne.slice(0, i)).width;
      ctx.save();
      ctx.globalAlpha = g.op;
      ctx.translate(x, PH_Y0 + li * PH_PAS + g.y);
      ctx.scale(g.sx, g.sy);
      ctx.fillStyle = (li === PHRASE.length - 1) ? L.accent : L.ink;
      ctx.fillText(ligne[i], 0, 0);
      ctx.restore();
    }
  });
  ctx.restore();
}

// --- Les cartes du Birdydex qui surgissent puis vont dans le compteur -----------------------
// Chaque carte sort de l'anneau qui vient de se poser. Elle est prise sur fond transparent
// (v2-site.py) : son arrondi est celui du site, il n'y a rien a decouper ici.
const ECHELLE_CARTE = 0.62;
PHOTOS.forEach(ph => {
  // l'anneau qui la porte : celui ou la demo a note cet oiseau (v2-site.py)
  ph.anneau = ANN.findIndex(a => a.especes.some(e => e.sci === ph.sci));
  if (ph.anneau < 0) throw new Error('espece absente de la carte : ' + ph.sci);
  tArrive[ph.anneau] = ph.t - 0.12;
});
function etatPhoto(ph, t) {
  const a = ANN[ph.anneau];
  const [px, py] = versCarte(a.x + a.w / 2, a.y + a.h / 2, zoomCarte(t));
  const cible = [COMPTEUR.x + 130, COMPTEUR.base - 80];
  const t1 = ph.t + ph.tenue, t2 = t1 + PHOTO_VOL;
  const arrive = spring(t - ph.t, 0.55, 26);
  const vol = E.expoInOut(seg(t1, t2, t));
  const x = lerp(px, cible[0], vol);
  const y = lerp(py - 34, cible[1], vol) - Math.sin(vol * Math.PI) * 110;
  const s = ECHELLE_CARTE * arrive * lerp(1, 0.14, vol);
  const op = (1 - seg(t2 - 0.06, t2, t)) * clamp(arrive * 1.6, 0, 1);
  return { x, y, s, op, t2 };
}
function dessinePhotos(t) {
  for (const ph of PHOTOS) {
    if (t < ph.t || t > ph.t + ph.tenue + PHOTO_VOL + 0.02) continue;
    const e = etatPhoto(ph, t);
    const im = IM[ph.fichier];
    if (!im || e.op <= 0.01 || e.s <= 0.005) continue;
    const w = im.width * e.s, h = im.height * e.s;
    ctx.save();
    ctx.globalAlpha = e.op;
    ctx.imageSmoothingQuality = 'high';
    // l'ombre suit la transparence de l'image, donc l'arrondi de la carte
    ctx.shadowColor = 'rgba(21,32,30,0.35)'; ctx.shadowBlur = 40 * e.s; ctx.shadowOffsetY = 14 * e.s;
    ctx.drawImage(im, e.x - w / 2, e.y - h, w, h);
    ctx.restore();
  }
}

// --- Le compteur ----------------------------------------------------------------------------
// La somme des nombres ecrits sur les anneaux poses : sur la carte de la seule liste du visiteur,
// ils totalisent exactement le nombre du site, v2-site.py s'arrete sinon. Avec toute la ligue
// c'etait 1 200, et le compteur ne correspondait plus a ce qu'on voyait.
function valeurCompteur(t) {
  let v = 0;
  for (let i = 0; i < NA; i++) v += ANN[i].n * E.cubicOut(seg(tArrive[i], tArrive[i] + MONTEE, t));
  return Math.round(v);
}
function dessineCompteur(t) {
  const t0 = SALVES[0].t0;
  if (t < t0 - 0.35) return;
  const entree = ssstep(t0 - 0.35, t0 - 0.05, t);
  const v = valeurCompteur(t);
  let pouls = 0;
  for (const ph of PHOTOS) {
    const ta = ph.t + ph.tenue + PHOTO_VOL;
    if (t > ta) pouls = Math.max(pouls, 0.07 * Math.exp(-(t - ta) * 11) * Math.cos((t - ta) * 26));
  }
  // l'arrivee sur le total : le coup final
  if (t > FIN) pouls = Math.max(pouls, 0.14 * Math.exp(-(t - FIN) * 9) * Math.cos((t - FIN) * 24));
  if (Math.abs(pouls) < 0.0015) pouls = 0;
  const px = 150, base = COMPTEUR.base;
  ctx.save();
  ctx.globalAlpha = entree;
  ctx.textBaseline = 'alphabetic';
  ctx.font = police('display', px);
  let cell = 0; for (let d = 0; d <= 9; d++) cell = Math.max(cell, ctx.measureText(String(d)).width);
  const s = String(v);
  const blocW = cell * 3;
  ctx.translate(COMPTEUR.x, base);
  ctx.translate(blocW / 2, -px * 0.3); ctx.scale(1 + pouls, 1 + pouls); ctx.translate(-blocW / 2, px * 0.3);
  ctx.textAlign = 'center';
  ctx.fillStyle = (v === TOTAL) ? L.accent : L.ink;
  for (let i = 0; i < s.length; i++) ctx.fillText(s[i], blocW - (s.length - i - 0.5) * cell, 0);
  ctx.font = police('display', 60);
  ctx.textAlign = 'left';
  ctx.fillStyle = L.mute;
  ctx.fillText('/ ' + SUR, blocW + 24, 0);
  ctx.font = police('text', 28);
  ctx.fillText('espèces vues', 8, 52);
  ctx.restore();
}

// --- Une image -------------------------------------------------------------------------------
// La fin : le quiz s'efface, le logo et le nom font en sens inverse le chemin de l'ouverture et reprennent leur
// place au centre, un vrai repos, puis ils montent pour laisser la place aux credits.
function ligneCentree(texte, y, px, couleur, op) {
  ctx.save();
  ctx.globalAlpha = op;
  ctx.font = police('text', px);
  ctx.textAlign = 'center';
  ctx.fillStyle = couleur;
  // coupe sur les espaces : les listes de noms prennent plusieurs lignes
  const mots = texte.split(' ');
  let ligne = '', yy = y;
  for (const m of mots) {
    const essai = ligne ? ligne + ' ' + m : m;
    if (ctx.measureText(essai).width > 1500 && ligne) { ctx.fillText(ligne, W / 2, yy); ligne = m; yy += px * 1.4; } else ligne = essai;
  }
  ctx.fillText(ligne, W / 2, yy);
  ctx.restore();
  return yy + px * 1.4;
}
function seekFin(t) {
  const sort = E.cubicInOut(seg(0.05, 0.55, t));
  if (sort < 1 && IM.finG) { ctx.save(); ctx.globalAlpha = 1 - sort; ctx.drawImage(IM.finG, 0, 0, W, H); ctx.restore(); }
  const tl = lerp(T.RANGE_FIN, T.RANGE, seg(0.35, 1.35, t));
  const monte = E.expoInOut(seg(3.7, 4.4, t));
  ctx.save();
  ctx.translate(960 * 0, -230 * monte);
  dessineLogo(tl);
  dessineNom(tl);
  ctx.restore();
  const CR = window.V2.credits;
  const op = k => E.cubicOut(seg(4.25 + k * 0.12, 4.65 + k * 0.12, t));
  let y = 600;
  y = ligneCentree('Photos : ' + CR.photos.join(', ') + ' et les photographes d\u2019iNaturalist (CC BY, BY-NC, BY-NC-SA), recadr\u00e9es et anim\u00e9es', y, 30, L.ink, op(0)) + 14;
  y = ligneCentree('Chants : ' + CR.chants.join(', ') + ' (xeno-canto, CC BY-NC-SA 4.0)', y, 30, L.ink, op(1)) + 14;
  y = ligneCentree('Fond de carte : \u00a9 OpenStreetMap, openstreetmap.org/copyright. Observations et fr\u00e9quences : eBird.org', y, 30, L.ink, op(2)) + 14;
  ligneCentree('Ce film est diffus\u00e9 sous licence CC BY-NC-SA 4.0. Toutes les sources sont dans la description.', y, 28, L.mute, op(3));
}
function seek(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = L.ground;
  ctx.fillRect(0, 0, W, H);
  if (MODE_FIN) { seekFin(t); return true; }
  dessineCarte(t);
  dessinePhrase(t);
  dessineCompteur(t);
  dessinePhotos(t);
  dessineLogo(t);
  dessineNom(t);
  return true;
}

// --- Ce que l'oracle suit --------------------------------------------------------------------
window.__track = t => {
  if (MODE_FIN) return { logo: { x: 760, y: 325, w: 430, h: 430, op: 1 } };
  const out = {};
  if (t >= T.CADRE) { const P = poseLogo(t); out.logo = { x: P.x, y: P.y, w: P.taille, h: P.taille, op: 1 }; }
  if (t >= T.NOM) {
    const N = poseNom(t);
    out.nom = { x: N.x, y: N.base - N.px, w: xsNom(N.px)[NOM.length], h: N.px * 1.2, op: 1 };
  }
  PHOTOS.forEach((ph, k) => {
    if (t < ph.t || t > ph.t + ph.tenue + PHOTO_VOL) return;
    const e = etatPhoto(ph, t), im = IM[ph.fichier];
    if (!im) return;
    out['photo' + k] = { x: e.x - im.width * e.s / 2, y: e.y - im.height * e.s, w: im.width * e.s, h: im.height * e.s, op: e.op };
  });
  if (t >= T.RANGE) { const z = zoomCarte(t); out.carte = { x: -(z - 1) * FOCUS[0], y: -(z - 1) * FOCUS[1], w: W * z, h: H * z, op: 1 }; }
  return out;
};
window.__motion = (t0, t1) => {
  if (MODE_FIN) return (t1 > 0.05 && t0 < 1.4) || (t1 > 3.7 && t0 < 5.2) ? 120 : 0;
  const A = window.__track(t0), B = window.__track(t1);
  let px = 0;
  for (const k of Object.keys(A)) {
    if (!B[k]) continue;
    px = Math.max(px, Math.hypot(B[k].x - A[k].x, B[k].y - A[k].y),
      Math.hypot((B[k].x + B[k].w) - (A[k].x + A[k].w), (B[k].y + B[k].h) - (A[k].y + A[k].h)));
  }
  const cours = t => (t >= T.CADRE && t < T.REPOS1) || (t >= T.RANGE && t < SALVES[0].t0 - 0.3) ||
    SALVES.some(s => t >= s.t0 - 0.35 && t < s.t1 + 0.6) || (t >= FIN && t < FIN + 0.5);
  if (cours(t0) || cours(t1)) px = Math.max(px, 24);
  return px;
};
window.__events = () => ({
  T: DUR,
  events: [
    { t: T.CADRE,         kind: 'wood',   pan: -0.2, v: 0.40 },
    { t: T.POINTS,        kind: 'glass',  pan: 0,    v: 0.35 },
    { t: T.NOM,           kind: 'wood',   pan: 0.2,  v: 0.55 },
    { t: T.RANGE + 0.2,   kind: 'air',    pan: 0,    v: 0.60 },
    { t: T.PHRASE,        kind: 'wood',   pan: -0.3, v: 0.45 },
    ...PHOTOS.map(ph => ({ t: ph.t, kind: 'glass', pan: 0.2, v: 0.45 })),
    ...PHOTOS.map(ph => ({ t: ph.t + ph.tenue + PHOTO_VOL, kind: 'bubble', pan: -0.5, v: 0.40 })),
    { t: FIN,             kind: 'sub',    pan: 0,    v: 0.60 },
  ],
  silences: [[0, 0.3], [T.REPOS1 + 0.2, T.RANGE], [FIN + 0.8, DUR]],
});
window.__seek = async t => seek(t);

function charge(cle, src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { IM[cle] = im; res(); };
    im.onerror = () => { console.warn('image absente : ' + src); res(); };
    im.src = src;
  });
}
window.__ready = (async () => {
  const jobs = [charge('carte', 'carte-fond.png')];
  if (MODE_FIN) jobs.push(charge('finG', 'fin-g.png'));
  ANN.forEach((a, i) => jobs.push(charge('a' + i, a.fichier)));
  PHOTOS.forEach(ph => jobs.push(charge(ph.fichier, ph.fichier)));
  const f = new FontFace('Source Serif Film', 'url(' + window.POLICE_TITRE + ')', { weight: '700' });
  document.fonts.add(await f.load());
  await Promise.all(jobs);
  if (window.LOOK && window.LOOK.ready) await window.LOOK.ready;
  await document.fonts.ready;
  return seek(0);
})();

const q = new URLSearchParams(location.search);
if (q.has('play')) {
  window.__ready.then(() => {
    const t0 = performance.now();
    const boucle = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(boucle); };
    boucle();
  });
} else if (q.has('t')) {
  window.__ready.then(() => seek(parseFloat(q.get('t'))));
}
function ajuste() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', ajuste); ajuste();
</script>
