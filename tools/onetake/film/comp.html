<!doctype html>
<meta charset="utf-8">
<title>L'Ornitheque - film de presentation</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  canvas{display:block;width:1920px;height:1080px}
</style>
<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>

<script src="motion.js"></script>
<script src="donnees.js"></script>
<script src="look.js"></script>
<script>
// =============================================================================
// L'Ornitheque - 30 s, un seul plan, SUR LES VRAIES CAPTURES.
//
// Rien n'est redessine ici. Chaque plan est une capture du site (3840x2160, deux pixels par
// point), et la camera s'y deplace : un rectangle source, etire sur l'image entiere. Un
// enchainement est un RACCORD DE POSITION - le meme objet occupe le meme endroit de l'ecran
// d'une capture a l'autre - double d'un fondu court. C'est ce qui separe un plan-sequence
// d'un diaporama, et c'est ce que mesure l'oracle du skill.
//
// Les rectangles des porteurs sont mesures dans le navigateur par tools/onetake/reperes.py,
// pas estimes a l'oeil.
//
// seek(t) est PUR : le rendu rappelle seek() plusieurs fois autour de chaque instant pour
// calculer le flou de mouvement, donc aucune valeur ne doit dependre des appels precedents.
// =============================================================================

const FPS = 30, DUR = 30;
window.__meta = { dur: DUR, fps: FPS, w: 1920, h: 1080 };

const W = 1920, H = 1080;
const { clamp, lerp, ssstep } = OM;

const L = (window.LOOK && window.LOOK.color) ? window.LOOK.color : {
  ground: '#eef2f1', deep: '#dde4e2', card: '#ffffff', line: '#d8dddc',
  mute: '#616966', ink: '#15201e', accent: '#0b7c77', accent2: '#c05e33',
};
const police = (r, px) => (window.LOOK && window.LOOK.font)
  ? window.LOOK.font(r, px)
  : (r === 'display' ? `${px}px Georgia, serif` : `${px}px "Segoe UI", system-ui, sans-serif`);

// --- Les reperes mesures, en pixels de prise --------------------------------------
// tools/onetake/reperes.py les releve dans le navigateur. Les recopier ici les fige : si
// l'appli bouge, on relance le script et on remplace ce bloc.
const R = {
  carteHuppe: { x: 1789, y: 903, w: 262, h: 353 },   // la vignette dans le mur
  photoFiche: { x: 2523, y: 351, w: 1288, h: 724 },  // l'en-tete de la fiche
  bloc:       { x: 2521, y: 647, w: 1292, h: 1193 }, // « Ou et quand la trouver », prise cadree
};
const PLEIN = { x: 0, y: 0, w: 3840, h: 2160 };
const MIG = { w: 3512, h: 1682 };                    // les semaines sont cadrees sur la carte

// --- La feuille de plans ----------------------------------------------------------
// Les repos sont les intervalles ou la camera ne bouge pas DU TOUT : l'oracle exige un quart
// d'images immobiles, et il compte un lent travelling pendant une pause comme du mouvement.
const T = {
  MUR: 0.0, APPROCHE: 2.0, FICHE: 6.0, FICHE_FIN: 8.4, FICHE_POSE: 9.2,
  CARTE: 9.2, CARTE_FIN: 10.4, CARTE_POSE: 11.0,
  GIRONDE: 11.0, GIRONDE_FIN: 12.0, GIRONDE_POSE: 12.6,
  SONS: 12.6, SONS_FIN: 13.6, SONS_POSE: 14.2,
  MONDE: 14.2, ANNEE: 15.0, ANNEE_FIN: 20.2, PIC_POSE: 21.6,
  RARETE: 21.6, RARETE_FIN: 22.6, RARETE_POSE: 23.0,
  CLASSEMENT: 23.0, CLASSEMENT_FIN: 25.6, CLASSEMENT_POSE: 26.2,
  QUIZ: 26.2, QUIZ_FIN: 27.4, QUIZ_POSE: 27.8,
  CHAT: 27.8, CHAT_FIN: 29.0,
  LOGO: 29.0, FIN: 30.0,
};
const FONDU = 0.45;   // duree du fondu d'un plan sur le precedent

// Un cadre 16/9 centre sur un rectangle, avec de l'air autour (marge = 1 pour coller pile).
function cadre(r, marge) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  let h = Math.max(r.h * marge, (r.w * marge) * 9 / 16);
  let w = h * 16 / 9;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
// Ramene un cadre dans les bornes de l'image : une camera qui deborde montre du noir.
function dedans(c, im) {
  const w = Math.min(c.w, im.w), h = w * 9 / 16;
  return { x: clamp(c.x, 0, im.w - w), y: clamp(c.y, 0, im.h - h), w, h };
}
// Un zoom autour du centre d'un cadre : sert aux poussees lentes.
function serre(c, k) {
  return { x: c.x + c.w * (1 - k) / 2, y: c.y + c.h * (1 - k) / 2, w: c.w * k, h: c.h * k };
}

const CADRE_MUR = dedans(cadre(R.carteHuppe, 1.25), { w: 3840, h: 2160 });
const CADRE_PHOTO = { ...R.photoFiche };
const CADRE_BLOC = dedans(cadre(R.bloc, 1.06), { w: 3840, h: 2160 });
const CADRE_MIG = { x: 900, y: 110, w: 2600, h: 1462 };   // Europe, Afrique, Asie

// --- Les plans ---------------------------------------------------------------------
// cles : [instant, cadre camera]. La camera interpole d'une cle a la suivante.
// porteur : le rectangle, dans la capture, de l'objet qui traverse le passage.
const PLANS = [
  { nom: 'mur', img: 'mur', porteur: R.carteHuppe, cles: [
      [T.MUR, PLEIN], [T.APPROCHE, PLEIN], [T.FICHE, CADRE_MUR]] },

  { nom: 'fiche', img: 'fiche', porteur: R.photoFiche, cles: [
      [T.FICHE, CADRE_PHOTO], [T.FICHE_FIN, PLEIN], [T.FICHE_POSE, PLEIN]] },

  { nom: 'carte', img: 'carteFr', porteur: R.bloc, cles: [
      [T.CARTE, CADRE_BLOC], [T.CARTE_FIN, serre(CADRE_BLOC, 0.94)],
      [T.CARTE_POSE, serre(CADRE_BLOC, 0.94)]] },

  // Le clic : meme cadrage que la vue France, pour que seul le contenu change.
  { nom: 'gironde', img: 'carteGironde', porteur: R.bloc, cles: [
      [T.GIRONDE, serre(CADRE_BLOC, 0.94)], [T.GIRONDE_FIN, serre(CADRE_BLOC, 0.78)],
      [T.GIRONDE_POSE, serre(CADRE_BLOC, 0.78)]] },

  { nom: 'sons', img: 'sons', porteur: { x: 2560, y: 300, w: 1260, h: 460 }, cles: [
      [T.SONS, { x: 2450, y: 250, w: 1390, h: 782 }],
      [T.SONS_FIN, { x: 2490, y: 275, w: 1310, h: 737 }],
      [T.SONS_POSE, { x: 2490, y: 275, w: 1310, h: 737 }]] },

  { nom: 'annee', img: 'mig', annee: true, porteur: null, cles: [
      [T.MONDE, CADRE_MIG], [T.ANNEE, CADRE_MIG], [T.ANNEE_FIN, CADRE_MIG],
      [T.PIC_POSE, CADRE_MIG]] },

  { nom: 'rarete', img: 'rarete', porteur: null, cles: [
      [T.RARETE, PLEIN], [T.RARETE_FIN, serre(PLEIN, 0.88)],
      [T.RARETE_POSE, serre(PLEIN, 0.88)]] },

  { nom: 'classement', img: 'classement', porteur: null, cles: [
      [T.CLASSEMENT, serre(PLEIN, 0.96)], [T.CLASSEMENT_FIN, serre(PLEIN, 0.82)],
      [T.CLASSEMENT_POSE, serre(PLEIN, 0.82)]] },

  { nom: 'quiz', img: 'quiz', porteur: null, cles: [
      [T.QUIZ, serre(PLEIN, 0.94)], [T.QUIZ_FIN, serre(PLEIN, 0.86)],
      [T.QUIZ_POSE, serre(PLEIN, 0.86)]] },

  { nom: 'chat', img: 'chat', porteur: null, cles: [
      [T.CHAT, serre(PLEIN, 0.94)], [T.CHAT_FIN, serre(PLEIN, 0.84)]] },

  { nom: 'logo', logo: true, porteur: null, cles: [
      [T.LOGO, PLEIN], [T.FIN, PLEIN]] },
];

// Debut visible d'un plan : son fondu commence avant sa premiere cle.
const debut = i => i === 0 ? 0 : PLANS[i].cles[0][0] - FONDU;
const finVisible = i => i === PLANS.length - 1 ? DUR : PLANS[i + 1].cles[0][0];

function cameraDe(plan, t) {
  const c = plan.cles;
  if (t <= c[0][0]) return c[0][1];
  if (t >= c[c.length - 1][0]) return c[c.length - 1][1];
  for (let i = 0; i < c.length - 1; i++) {
    if (t <= c[i + 1][0]) {
      // ssstep(e0, e1, x) prend TROIS arguments : appele avec un seul il rend NaN,
      // et toute la camera devient NaN sans qu'aucune erreur ne se voie.
      const u = ssstep(0, 1, (t - c[i][0]) / Math.max(1e-6, c[i + 1][0] - c[i][0]));
      const a = c[i][1], b = c[i + 1][1];
      return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u),
               w: lerp(a.w, b.w, u), h: lerp(a.h, b.h, u) };
    }
  }
  return c[c.length - 1][1];
}

function alphaDe(i, t) {
  const d = debut(i);
  if (t < d) return 0;
  if (t >= finVisible(i)) return 0;
  if (i === 0) return 1;
  return clamp((t - d) / FONDU, 0, 1);
}

// La semaine montree a l'instant t, en nombre reel : la partie decimale sert au fondu entre
// deux semaines. Sans ce fondu, deux images sur trois etaient identiques pendant l'annee -
// 3,4 s d'immobilite involontaire au milieu du plus long moment du film (mesure le 29/09).
const SEMAINES = 52;
function semaineA(t) {
  if (t <= T.ANNEE) return 0;
  if (t >= T.ANNEE_FIN) return SEMAINES - 1;
  return (t - T.ANNEE) / (T.ANNEE_FIN - T.ANNEE) * (SEMAINES - 1);
}

// --- Dessin --------------------------------------------------------------------------
const IM = {};
const ctx = document.getElementById('cv').getContext('2d');

function poseImage(im, cam, alpha) {
  if (!im || !im.width) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, cam.x, cam.y, cam.w, cam.h, 0, 0, W, H);
  ctx.restore();
}

function dessineAnnee(cam, alpha, t) {
  const s = semaineA(t);
  const i = Math.min(SEMAINES - 1, Math.floor(s));
  const j = Math.min(SEMAINES - 1, i + 1);
  const f = s - i;
  poseImage(IM['m' + i], cam, alpha);
  if (j !== i && f > 0.001) poseImage(IM['m' + j], cam, alpha * f);
}

function dessineLogo(alpha, t) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = L.ground;
  ctx.fillRect(0, 0, W, H);
  const im = IM.huppe;
  // Le logo grandit un peu puis se fige : la pose finale doit etre VRAIMENT immobile.
  const u = ssstep(0, 1, clamp((t - T.LOGO) / 0.6, 0, 1));
  const k = lerp(0.86, 1, u);
  if (im && im.width) {
    const h = 240 * k, w = h * im.width / im.height;
    ctx.drawImage(im, W / 2 - w / 2, H / 2 - h - 10, w, h);
  }
  ctx.fillStyle = L.ink;
  ctx.textAlign = 'center';
  ctx.font = police('display', 76);
  ctx.fillText('L’Ornithèque', W / 2, H / 2 + 86);
  ctx.font = police('text', 26);
  ctx.fillStyle = L.mute;
  ctx.fillText('la liste, la carte, le chant', W / 2, H / 2 + 136);
  ctx.restore();
}

function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < PLANS.length; i++) {
    const a = alphaDe(i, t);
    if (a <= 0) continue;
    const p = PLANS[i], cam = cameraDe(p, t);
    if (p.logo) dessineLogo(a, t);
    else if (p.annee) dessineAnnee(cam, a, t);
    else poseImage(IM[p.img], cam, a);
  }
  return true;
}

// --- Ce que l'oracle suit ------------------------------------------------------------
// Le porteur d'un plan, ramene aux coordonnees de l'ECRAN. Deux plans voisins partagent le
// meme nom de cle : c'est ainsi que l'oracle voit qu'un objet traverse le passage.
function porteurEcran(p, t) {
  if (!p.porteur) return null;
  const cam = cameraDe(p, t);
  return {
    x: (p.porteur.x - cam.x) / cam.w * W,
    y: (p.porteur.y - cam.y) / cam.h * H,
    w: p.porteur.w / cam.w * W,
    h: p.porteur.h / cam.h * H,
  };
}

window.__track = t => {
  const out = {};
  for (let i = 0; i < PLANS.length; i++) {
    const a = alphaDe(i, t);
    if (a <= 0) continue;
    const p = PLANS[i];
    // La camera elle-meme est un porteur : ses coins bougent a chaque poussee, et c'est ce
    // mouvement que le flou doit suivre quand aucun objet n'est declare.
    const cam = cameraDe(p, t);
    out['cam_' + p.nom] = { x: -cam.x / cam.w * W, y: -cam.y / cam.h * H,
                            w: 3840 / cam.w * W, h: 2160 / cam.h * H, op: a };
    const r = porteurEcran(p, t);
    if (r) out.huppe = { ...r, op: a };
  }
  return out;
};

window.__motion = (t0, t1) => {
  const A = window.__track(t0), B = window.__track(t1);
  let px = 0;
  for (const k of Object.keys(A)) {
    if (!B[k]) continue;
    px = Math.max(px,
      Math.hypot(B[k].x - A[k].x, B[k].y - A[k].y),
      Math.hypot((B[k].x + B[k].w) - (A[k].x + A[k].w),
                 (B[k].y + B[k].h) - (A[k].y + A[k].h)));
  }
  // L'annee fait changer l'image sans que la camera bouge : le flou doit quand meme etre
  // calcule, sinon le defile parait saccade.
  const ds = Math.abs(semaineA(t1) - semaineA(t0));
  px = Math.max(px, ds * 26);
  return px;
};

// --- Le son ---------------------------------------------------------------------------
// La partition lit CETTE liste plutot que des instants recopies a la main : un moment
// deplace emporte son bruitage avec lui.
window.__events = () => ({
  T: DUR,
  events: [
    { t: T.APPROCHE,      kind: 'air',    pan: 0,     v: 0.45 },  // l'approche demarre
    { t: T.FICHE,         kind: 'bubble', pan: 0,     v: 0.70 },  // la vignette devient fiche
    { t: T.CARTE,         kind: 'glass',  pan: 0.10,  v: 0.50 },  // la carte de presence
    { t: T.GIRONDE,       kind: 'wood',   pan: -0.25, v: 0.75 },  // le clic sur le departement
    { t: T.SONS,          kind: 'wood',   pan: -0.35, v: 0.70 },  // l'onglet des sons
    { t: T.MONDE,         kind: 'air',    pan: 0,     v: 1.00 },  // le monde s'ouvre
    { t: T.RARETE,        kind: 'sub',    pan: 0,     v: 0.90 },  // retour sur la France
    { t: T.CLASSEMENT,    kind: 'air',    pan: 0,     v: 0.45 },  // le classement
    { t: T.CLASSEMENT_FIN, kind: 'glass', pan: 0,     v: 0.55 },  // les barres s'arretent
    { t: T.QUIZ,          kind: 'wood',   pan: 0,     v: 0.70 },  // le quiz
    { t: T.CHAT,          kind: 'bubble', pan: -0.20, v: 0.70 },  // le tchat
    { t: T.CHAT + 0.55,   kind: 'bubble', pan: 0.15,  v: 0.55 },
    { t: T.LOGO,          kind: 'sub',    pan: 0,     v: 0.80 },  // le repli sur le logo
  ],
  // Le chant de la huppe, pendant qu'on est sur l'onglet des sons. Ce n'est pas un bruitage :
  // c'est l'enregistrement que l'appli fait ecouter.
  chant: { t: T.SONS, jusqua: T.ANNEE + 0.6, fichier: 'assets/chant.mp3' },
  // Les silences voulus, que l'oracle verifie : l'ouverture et la pose sur le pic.
  silences: [[0, T.APPROCHE], [T.ANNEE_FIN + 0.3, T.RARETE]],
});

window.__seek = async t => seek(t);

function charge(cle, url) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { IM[cle] = im; res(); };
    im.onerror = () => { console.warn('image absente : ' + url); res(); };
    im.src = url;
  });
}

window.__ready = (async () => {
  const jobs = [
    charge('mur', 'assets/mur.jpg'),
    charge('fiche', 'assets/fiche.jpg'),
    charge('carteFr', 'assets/carte-fr.jpg'),
    charge('carteGironde', 'assets/carte-gironde.jpg'),
    charge('sons', 'assets/sons.jpg'),
    charge('rarete', 'assets/rarete.jpg'),
    charge('classement', 'assets/classement.jpg'),
    charge('quiz', 'assets/quiz.jpg'),
    charge('chat', 'assets/chat.jpg'),
    charge('huppe', 'assets/huppe.png'),
  ];
  for (let w = 0; w < SEMAINES; w++) {
    jobs.push(charge('m' + w, 'assets/mig/w' + String(w).padStart(2, '0') + '.jpg'));
  }
  await Promise.all(jobs);
  await document.fonts.ready;
  return seek(0);
})();

// Lecture directe dans un navigateur : ?play, ou ?t=6.4 pour epingler une image.
const q = new URLSearchParams(location.search);
if (q.has('play')) {
  window.__ready.then(() => {
    const t0 = performance.now();
    const boucle = () => {
      seek(((performance.now() - t0) / 1000) % DUR);
      requestAnimationFrame(boucle);
    };
    boucle();
  });
} else if (q.has('t')) {
  window.__ready.then(() => seek(parseFloat(q.get('t'))));
}
function ajuste() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', ajuste); ajuste();
</script>
